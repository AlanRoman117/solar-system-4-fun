<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Navigator</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="info-panel" class="info-panel">
        <h2>Solar System</h2>
        <button id="toggle-nav" class="toggle-button">Toggle Free Roam</button>
        <ul id="planet-list"></ul>
    </div>

    <div id="planet-info-panel" class="info-panel" style="display: none;">
        <h2 id="planet-info-title"></h2>
        <div id="planet-info-content"></div>
        <button id="planet-info-close" class="toggle-button">Close</button>
    </div>

    <button id="learn-more-button" class="toggle-button" style="display: none; position: absolute; bottom: 80px; right: 10px;"></button>

    <div id="controls-info">
        <b>Free Roam Controls:</b><br>
        <b>W, A, S, D:</b> Move<br>
        <b>Mouse:</b> Look Around<br>
        <b>Click:</b> Lock/Unlock Mouse
    </div>

    <!-- Link to the Three.js and Tween.js libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <!-- Link to the external JavaScript file -->
    <!-- The `type="module"` attribute is crucial for using ES6 import/export syntax -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
